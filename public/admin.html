<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f6f5f2"><title>VetStation · Owner workspace</title><link rel="icon" href="/assets/vetstation-logo-square.jpeg"><link rel="stylesheet" href="/admin.css?v=3"><script src="/admin.js?v=3" defer></script></head>
<body><a class="skip" href="#main">Skip to workspace</a><header class="topbar"><a class="brand" href="/" aria-label="VetStation home"><img src="/assets/vetstation-logo-square.jpeg" alt="" width="44" height="44"><span><strong>VET<span>STATION</span></strong><small id="brand-subtitle"></small></span></a><div class="top-actions"><label for="admin-language" id="language-label"></label><select id="admin-language" aria-label="Language"><option value="he">עברית</option><option value="ar">العربية</option><option value="en">English</option></select><button class="quiet" id="logout" type="button" hidden></button></div></header>
<main id="main" class="shell"><section class="login-card" id="login-panel" aria-labelledby="login-title"><p class="eyebrow" id="login-eyebrow"></p><h1 id="login-title"></h1><p id="login-description"></p><form id="login-form"><label><span id="username-label"></span><input name="username" autocomplete="username" required></label><label><span id="password-label"></span><input name="password" type="password" autocomplete="current-password" required></label><button class="primary" id="login-button" type="submit"></button></form><p class="feedback" id="login-message" role="status" aria-live="polite"></p></section>
<section id="inbox-panel" hidden aria-labelledby="workspace-title"><div class="page-heading"><div><p class="eyebrow" id="workspace-eyebrow"></p><h1 id="workspace-title"></h1><p id="workspace-description"></p></div><span class="sync-time" id="sync-time"></span></div><div class="stats" id="stats" aria-label="Request summary"></div><div class="workspace-grid"><section class="requests-panel" aria-labelledby="requests-title"><div class="panel-heading"><div><h2 id="requests-title"></h2><p id="result-count"></p></div><div class="panel-actions"><button class="quiet" id="refresh" type="button"></button><button class="quiet" id="export" type="button"></button></div></div><div class="filters"><label for="search" id="search-label"></label><input id="search" type="search" maxlength="100" autocomplete="off"><label for="status-filter" id="filter-label"></label><select id="status-filter"><option value="all"></option><option value="new"></option><option value="contacted"></option><option value="closed"></option><option value="due"></option></select></div><p class="feedback" id="inbox-message" role="status" aria-live="polite"></p><div class="request-list" id="inquiries"></div><div class="pagination"><button class="quiet" id="previous" type="button"></button><span id="page-label"></span><button class="quiet" id="next" type="button"></button></div></section><aside class="help-panel"><h2 id="help-title"></h2><ol id="help-steps"></ol><p id="retention-note"></p><p id="privacy-note"></p></aside></div></section></main></body></html>
